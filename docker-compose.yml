services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_USER: aoponto
      POSTGRES_PASSWORD: aoponto
      POSTGRES_DB: aoponto
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoponto -d aoponto"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"   # opcional: para usar DBeaver. Remova se já tiver Postgres local.

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://aoponto:aoponto@db:5432/aoponto
      PERMITIR_SIMULACAO: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: